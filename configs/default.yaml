project:
  name: "ADE"
  pipeline_version: "0.1.0"

visual_engine:
  schema_version: 1
  execution_mode: "exploratory"
  dataset_roles: ["query"]
  backend_id: "statistical_visual_v2"
  backend_version: "1"
  device_policy: "cpu"
  deterministic: true
  random_seed: 42
  cache_policy: "disabled"
  resources:
    batch_size: 16
    max_workers: 1
    max_memory_mb: 4096
    max_files: 100000
    max_file_size_mb: 1024
  reference_memory:
    enabled: false
    manifest_path: null
    search_backend: "numpy_exact"
    metric: "euclidean"
    storage_root: "data/reference_memory"
    coreset_strategy: "none"
    maximum_vectors: 10000
    selection_ratio: null
    seed: 42
    search_batch_size: 128
    memory_map: true
    exact_search_metric: "euclidean"
  calibration:
    enabled: false
    method: "none"
    manifest_path: null

preprocessing:
  patch_size: 64
  patch_stride: 64
  patch_sizes:
    - 64
  patch_strides:
    - 64

discovery:
  max_candidate_anomalies: 10
  top_k:
  max_concepts: 5
  novelty_metric: "euclidean"
  novelty_strategy: "hybrid"
  scoring_backend: "centroid_distance"
  clustering_backend: "threshold_candidate_grouping"
  cluster_distance_threshold: 0.35
  random_seed: 42
  memory_aware_scoring:
    enabled: true
    neighbor_top_k: 5
    exclude_same_source: false
    weight_global_distance: 0.5
    weight_neighbor_distance: 0.5
  diversity:
    enabled: true
    min_spatial_distance: 32
    max_per_image: 3
    prefer_multiple_scales: true
  concepts:
    min_supporting_examples: 2
    max_supporting_examples: 5
    min_confidence_to_highlight: 0.5

memory:
  enabled: true
  metric: "euclidean"
  top_k_neighbors: 5
  include_neighbors_in_report: true

feedback:
  enabled: true
  store_path: "data/feedback/feedback.jsonl"

review_memory:
  enabled: true
  feedback_store_path: "data/feedback/feedback.jsonl"
  positive_labels:
    - interesting
    - important
  negative_labels:
    - false_positive
    - not_useful
  neutral_labels:
    - known_pattern
    - duplicate
    - needs_more_data

tabular:
  id_column:
  max_categorical_cardinality: 50
  missing_value_tokens:
    - ""
    - "na"
    - "n/a"
    - "nan"
    - "null"
    - "none"

timeseries:
  timestamp_column:
  entity_column:
  window_size: 3
  missing_value_tokens:
    - ""
    - "na"
    - "n/a"
    - "nan"
    - "null"
    - "none"

reporting:
  report_version: "1.0"
  human_review_required: true
  save_patch_previews: true
  assets_dir_name: "assets"
  runs_dir_name: "runs"

validation:
  supported_image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".webp"
  min_images: 1
  warn_if_images_below: 3
  warn_if_estimated_patches_above: 50000
  min_image_width: 32
  min_image_height: 32

demo_data:
  output_dir: "data/raw/demo_images"
  image_count: 6
  image_size: 256
  seed: 42
