[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ade-discovery-engine"
version = "0.1.0"
description = "Autonomous Discovery Engine private research prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ADE Research" }]
keywords = ["discovery", "anomaly-detection", "research", "visual-data"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10", "fastapi>=0.115", "httpx>=0.27"]

[project.scripts]
ade = "ade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=tests/.tmp_pytest --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["ade"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
