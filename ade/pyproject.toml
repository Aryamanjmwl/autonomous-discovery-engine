[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ade-discovery-engine"
version = "0.1.0"
description = "Autonomous Discovery Engine private research prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ADE Research" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "opencv-python>=4.8",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ade = "ade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
